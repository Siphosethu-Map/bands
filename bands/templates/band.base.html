<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BandVault{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top:    #0a1a0f;
            --bg-mid:    #0d2016;
            --bg-bot:    #081510;
            --surface:   #112318;
            --card:      #162d1e;
            --border:    #1e3d28;
            --accent:    #00C853;
            --accent2:   #00a844;
            --text:      #e8f0ea;
            --muted:     #6b9478;
        }
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        h1, h2, h3 {
            font-family: 'Barlow Condensed', sans-serif;
            letter-spacing: 0.02em;
        }
        .navbar {
            background: rgba(10, 26, 15, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 1.5rem;
        }
        .navbar-brand {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent) !important;
            letter-spacing: 0.05em;
        }
        .nav-link {
            color: var(--muted) !important;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--text) !important; }
        .btn-accent {
            background: var(--accent);
            color: #071209;
            font-weight: 600;
            border: none;
            padding: 0.55rem 1.4rem;
            border-radius: 4px;
            font-size: 0.875rem;
            transition: background 0.2s;
            display: inline-block;
        }
        .btn-accent:hover { background: var(--accent2); color: #071209; }
        .btn-outline-accent {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            font-weight: 600;
            padding: 0.55rem 1.4rem;
            border-radius: 4px;
            font-size: 0.875rem;
            transition: all 0.2s;
            display: inline-block;
        }
        .btn-outline-accent:hover { background: var(--accent); color: #071209; }
        .band-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: var(--text);
            display: block;
        }
        .band-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 200, 83, 0.1);
            color: var(--text);
        }
        .band-card .band-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .genre-badge {
            display: inline-block;
            background: rgba(0, 200, 83, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 200, 83, 0.25);
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .form-control, .form-select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            padding: 0.65rem 0.9rem;
        }
        .form-control:focus, .form-select:focus {
            background: var(--surface);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 0 2px rgba(0, 200, 83, 0.15);
        }
        .form-control::placeholder { color: var(--muted); }
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.4rem;
        }
        .auth-card {
            background: rgba(17, 35, 24, 0.9);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        .page-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }
        .auth-wrap {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .section-divider {
            border-color: var(--border);
            margin: 2rem 0;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent2); }
        .text-muted { color: var(--muted) !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md">
        <div class="container-fluid" style="max-width:1100px; margin:0 auto;">
            <a class="navbar-brand" href="{% url 'bands:home' %}">⚡ BandVault</a>
            <div class="d-flex gap-3 align-items-center ms-auto">
                <a class="nav-link" href="{% url 'bands:home' %}">Bands</a>
                <a class="nav-link" href="{% url 'bands:about' %}">About</a>
                <a class="nav-link" href="{% url 'bands:add_band' %}">+ Add Band</a>
                <a class="nav-link" href="{% url 'bands:log_out' %}">Log out</a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
