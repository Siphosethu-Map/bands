{% extends 'band.base.html' %}
{% block title %}{{ band.name }} — BandVault{% endblock title %}

{% block content %}
<div class="page-wrap">
    <a href="{% url 'bands:home' %}" style="color: var(--muted); font-size: 0.875rem;">← Back to all bands</a>

    <div style="margin-top: 2rem; max-width: 700px;">
        <span class="genre-badge" style="margin-bottom: 1rem; display: inline-block;">{{ band.genre }}</span>
        <h1 style="font-size: clamp(2.5rem, 6vw, 3.5rem); font-weight: 700; line-height: 1.05; margin-bottom: 0.5rem;">
            {{ band.name }}
        </h1>
        <p style="color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem;">
            Formed {{ band.formed_date|date:"F j, Y" }}
        </p>

        <hr class="section-divider">

        <h3 style="font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.75rem;">About</h3>
        <p style="line-height: 1.8; color: var(--text);">{{ band.description }}</p>
    </div>
</div>
{% endblock %}
