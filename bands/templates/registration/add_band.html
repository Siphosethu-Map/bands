{% extends 'band.base.html' %}
{% block title %}Add a Band — BandVault{% endblock title %}

{% block content %}
<div class="page-wrap">
    <a href="{% url 'bands:home' %}" style="color: var(--muted); font-size: 0.875rem;">← Back</a>
    <div style="max-width: 560px; margin-top: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">Add a Band</h1>
        <p style="color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem;">Fill in the details below to add a band to the vault.</p>

        <form method="post" action="">
            {% csrf_token %}
            <div style="margin-bottom: 1.25rem;">
                <label class="form-label">Band Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Arctic Monkeys" required>
            </div>
            <div style="margin-bottom: 1.25rem;">
                <label class="form-label">Genre</label>
                <input type="text" class="form-control" id="genre" name="genre" placeholder="e.g. Indie Rock" required>
            </div>
            <div style="margin-bottom: 1.25rem;">
                <label class="form-label">Date Formed</label>
                <input type="date" class="form-control" id="formed_date" name="formed_date" required>
            </div>
            <div style="margin-bottom: 1.75rem;">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" id="description" rows="5" placeholder="Tell us about this band..."></textarea>
            </div>
            <button type="submit" class="btn-accent">Add to Vault</button>
        </form>
    </div>
</div>
{% endblock %}
